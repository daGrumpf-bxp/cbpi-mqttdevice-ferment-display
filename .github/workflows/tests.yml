name: Tests

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  host-tests:
    name: Host-side parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y g++ make curl

      - name: Run tests
        working-directory: ./test
        run: make test

  build-firmware:
    name: PlatformIO build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Prepare dummy secrets.h for build
        run: |
          cp include/secrets.h.example include/secrets.h
          # The build only needs valid syntax; values are placeholder.

      - name: Compile firmware
        run: pio run -e d1_mini

      - name: Report binary size
        run: |
          ls -la .pio/build/d1_mini/firmware.bin
          echo "::notice::Firmware compiled successfully"
