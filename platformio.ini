; ============================================================================
; cbpi-mqttdevice-ferment-display - PlatformIO build configuration
; ============================================================================
; Phase 1 (current): Wemos D1 mini (ESP8266) — ST7789V TFT 240x320 SPI (landscape)
; Phase 2 (planned): ESP32 WROOM-32 + same screen + encoder + buttons
;
; Pre-v2 step (branch feat/spi-display): the SSD1306 backend has been removed.
; SSD1306 historical reference is preserved in git tag v0.7.10 on main.
; ============================================================================

[platformio]
default_envs = d1_mini

; ----------------------------------------------------------------------------
; Wemos D1 mini — ESP8266 + ST7789V TFT 240x320 SPI
; ----------------------------------------------------------------------------
[env:d1_mini]
platform         = espressif8266@4.2.1
board            = d1_mini
framework        = arduino

; Serial monitor / upload
monitor_speed    = 115200
upload_speed     = 921600
monitor_filters  = esp8266_exception_decoder, time
; upload_port    = /dev/ttyUSB0   ; uncomment to force a specific port

; ---------------------------------------------------------------------------
; Build flags
; ---------------------------------------------------------------------------
; TFT_eSPI is configured at compile time via #defines, not runtime. We pass
; them here so the lib can inline its SPI calls and skip generic dispatch —
; this is the official pattern from TFT_eSPI's documentation. The downside
; is that platformio.ini becomes longer; the upside is significantly faster
; SPI throughput (matters when we'll start drawing on full-screen surfaces).
;
; Pin assignments — chosen to avoid boot-strap pins:
;   GPIO0 (D3) and GPIO2 (D4) are boot-strap on ESP8266 — never use them
;   as TFT control pins, the TFT's reset pulse can put the chip in flash
;   mode on power-up. GPIO2 (D4) also drives the onboard LED used by the
;   heartbeat module, so it's doubly off-limits here.
;
;   Used hardware HSPI:
;     SCK  -> GPIO14 (D5)   — fixed, hardware
;     MOSI -> GPIO13 (D7)   — fixed, hardware
;     CS   -> GPIO15 (D8)   — fixed, hardware
;
;   Software-driven control lines (any free GPIO):
;     DC   -> GPIO5  (D1)
;     RST  -> GPIO4  (D2)
;
;   The TFT MISO is not used by us (we never read back from the screen),
;   so we tell TFT_eSPI to skip it with TFT_MISO = -1.
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D MQTT_MAX_PACKET_SIZE=2048
    ; --- TFT_eSPI configuration ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=5
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    ; uncomment next line for verbose runtime logs:
    ; -D DEBUG_VERBOSE=1

; ---------------------------------------------------------------------------
; Library dependencies — pinned versions for reproducible builds
; ---------------------------------------------------------------------------
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    marvinroger/AsyncMqttClient @ ^0.9.0
    bodmer/TFT_eSPI @ ^2.5.43
