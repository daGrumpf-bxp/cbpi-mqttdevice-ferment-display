; ============================================================================
; mqttdevice-ferment - PlatformIO build configuration
; ============================================================================
; Phase 1: Wemos D1 mini (ESP8266) — dev with SSD1306 OLED 128x64 I2C
; Phase 2: ESP32 WROOM-32 + ST7789V TFT 240x320 (to be added later)
; ============================================================================

[platformio]
default_envs = d1_mini

; ----------------------------------------------------------------------------
; Phase 1 — Wemos D1 mini
; ----------------------------------------------------------------------------
[env:d1_mini]
platform         = espressif8266@4.2.1
board            = d1_mini
framework        = arduino

; Serial monitor / upload
monitor_speed    = 115200
upload_speed     = 921600
monitor_filters  = esp8266_exception_decoder, time
; upload_port    = /dev/ttyUSB0   ; uncomment to force a specific port

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D MQTT_MAX_PACKET_SIZE=2048
    ; uncomment next line for verbose runtime logs:
    ; -D DEBUG_VERBOSE=1

; Library dependencies — pinned versions for reproducible builds
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    marvinroger/AsyncMqttClient @ ^0.9.0
    olikraus/U8g2 @ ^2.35.30
